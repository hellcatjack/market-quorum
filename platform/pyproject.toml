[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingng-platform"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.18,<2",
  "asyncmy>=0.2.10,<1",
  "cryptography>=46,<50",
  "email-validator>=2.2,<3",
  "exchange-calendars>=4.11,<5",
  "fastapi>=0.139,<1",
  "httpx>=0.28,<1",
  "mcp>=1.28,<2",
  "pandas>=2.3,<3",
  "psutil>=7.2,<8",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  "prometheus-client>=0.24,<1",
  "PyJWT[crypto]>=2.10,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn>=0.35,<1",
  "yfinance>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.16,<1"]

[project.scripts]
tradingng-platform-api = "tradingng_platform.api.app:main"
tradingng-platform-scheduler = "tradingng_platform.scheduler.main:main"
tradingng-platform-worker = "tradingng_platform.worker.main:main"
tradingng-platform-webhooks = "tradingng_platform.webhooks.worker:main"
tradingng-platform-runner = "tradingng_platform.runner.cli:main"
tradingng-platform-mcp-stdio = "tradingng_platform.mcp.stdio:main"
tradingng-platform-validation = "tradingng_platform.validation.main:main"
tradingng-platform-alpha-broker = "tradingng_platform.vendors.alpha_vantage_broker_app:main"
tradingng-platform-integrity-audit = "tradingng_platform.integrity.main:main"
tradingng-platform-name-backfill = "tradingng_platform.instruments.backfill:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../scripts"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["integration: requires the development PostgreSQL service"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
