services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tradingng
      POSTGRES_USER: tradingng
      POSTGRES_PASSWORD: tradingng
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingng -d tradingng"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - tradingng-postgres-dev:/var/lib/postgresql/data

volumes:
  tradingng-postgres-dev:
