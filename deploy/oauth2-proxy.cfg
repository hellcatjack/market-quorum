http_address = "0.0.0.0:4180"
provider = "oidc"
oidc_issuer_url = "https://ushome.amycat.com/realms/tradingng"
client_id = "tradingng-web"
client_secret = "${OAUTH2_PROXY_CLIENT_SECRET}"
redirect_url = "https://ushome.amycat.com/oauth2/callback"
backend_logout_url = "https://ushome.amycat.com/realms/tradingng/protocol/openid-connect/logout?id_token_hint={id_token}"
code_challenge_method = "S256"
email_domains = ["*"]
cookie_name = "__Host-tradingng"
cookie_secret = "${OAUTH2_PROXY_COOKIE_SECRET}"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "4m"
cookie_csrf_per_request = true
cookie_csrf_per_request_limit = 16
set_xauthrequest = true
pass_access_token = true
skip_jwt_bearer_tokens = true
skip_provider_button = true
reverse_proxy = true
upstreams = ["static://202"]
